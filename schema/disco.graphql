# =============================================================================
# PUBLIC GraphQL Schema
# =============================================================================


schema {
  query: Query
  mutation: Mutation
}

"""
Root query type for retrieving data from the DiscoveryContext system.
All queries support filtering and pagination where applicable.

"""

type Query {

  """
  Query secrets with optional filtering, pagination, and sorting.
  Returns a paginated list of secrets matching the filter criteria.
  Use filters to search by provider, type, risk, name, or other attributes.
  Use sort to order results by a specific field (defaults to id ascending).

  """
  secrets(filter: SecretsFilterInput, pageInput: PageInput, sort: [SecretsSortInput]): SecretsPage!

  """
  Query workloads with optional filtering, pagination, and sorting.
  Returns a paginated list of workloads matching the filter criteria.
  Use filters to search by provider, type, name, or other attributes.
  Use sort to order results by a specific field (defaults to id ascending).

  """
  workloads(filter: WorkloadsFilterInput, pageInput: PageInput, sort: [WorkloadsSortInput]): WorkloadPage!

  """
  Query AI agents with optional filtering, pagination, and sorting.
  Returns a paginated list of AI agents matching the filter criteria.
  Use filters to search by provider, type, name, risk, or other attributes.
  Use sort to order results by a specific field (defaults to id ascending).

  """
  aiAgents(filter: AiAgentsFilterInput, pageInput: PageInput, sort: [AiAgentsSortInput]): AiAgentPage!
}

"""
Root mutation type for modifying data in the DiscoveryContext system.
All mutations are idempotent and support bulk operations.

"""

type Mutation {

  """
  Add or replace secrets from an external data source.
  Creates new secrets or updates existing ones based on originId.
  Returns the processed secrets and total count.
  Use this to synchronize secrets from external systems.

  """
  addReplaceExternalSecrets(secrets: [SecretInput!]!): AddReplaceSecretsResponse!

  """
  Add or replace workloads from an external data source.
  Creates new workloads or updates existing ones based on originId.
  Returns the processed workloads and total count.
  Use this to synchronize workloads from external systems.

  """
  addReplaceExternalWorkloads(workloads: [WorkloadInput!]!): AddReplaceWorkloadsResponse!

  """
  Add or replace AI agents from an external data source.
  Creates new AI agents or updates existing ones based on originId.
  Returns the processed AI agents and total count.
  Use this to synchronize AI agents from external systems.

  """
  addReplaceExternalAiAgents(aiAgents: [AiAgentInput!]!): AddReplaceAiAgentsResponse!

  """
  Delete secrets matching the filter criteria.
  Permanently removes secrets from the system.
  Returns the count of deleted secrets.
  Use with caution - deletion is irreversible.

  """
  deleteExternalSecrets(filter: SecretsFilterInput!): DeleteSecretsResponse!

  """
  Delete workloads matching the filter criteria.
  Permanently removes workloads from the system.
  Returns the count of deleted workloads.
  Use with caution - deletion is irreversible.

  """
  deleteExternalWorkloads(filter: WorkloadsFilterInput!): DeleteResponse!

  """
  Delete AI agents matching the filter criteria.
  Permanently removes AI agents from the system.
  Returns the count of deleted AI agents.
  Use with caution - deletion is irreversible.

  """
  deleteExternalAiAgents(filter: AiAgentsFilterInput!): DeleteResponse!
}

scalar AWSDateTime

scalar AWSJSON

"""
Classification type for tags, annotations, and labels.
Used to categorize metadata associated with secrets, workloads, and AI agents.

"""

enum TagType {
  "Standard tag for categorization and filtering"
  TAG
  "Annotation providing additional context or notes"
  ANNOTATION
  "Label for identification and organization"
  LABEL
}

"""
Indicates whether a secret value changes over time or remains static.
Helps determine appropriate caching and refresh strategies.

"""

enum SecretPermanence {
  "Secret value changes dynamically and should be refreshed periodically"
  DYNAMIC
  "Secret value remains static until explicitly updated"
  STATIC
}

"""
Source system or integration that provides the data.
Identifies the origin of secrets, workloads, or AI agents in the system.

"""

enum DataSourceType {
  "CyberArk Secrets Hub integration"
  SECRETS_HUB
  "External API integration"
  EXTERNAL_API
  "CyberArk Conjur integration"
  CONJUR
  "Certificate Manager for Kubernetes agent"
  KUBERNETES_DISCOVERY_AGENT
  "SAI (Service Account Intelligence) integration"
  SAI
  "AWS cloud scanner integration"
  AWS_SCANNER
  "Azure cloud scanner integration"
  AZURE_SCANNER
  "CyberArk SMS integration"
  SECRETS_MANAGER_SAAS
}

"""Sort order direction for query results."""

enum SortOrder {
  "Ascending order (A-Z, 0-9, oldest to newest)"
  ASC
  "Descending order (Z-A, 9-0, newest to oldest)"
  DESC
}

"""
Input for creating or updating a tag entry.
Used to attach metadata to secrets, workloads, or AI agents.

"""

input TagEntryInput {
  "Type of tag (tag, annotation, or label)"
  type: TagType!
  "Tag key/name"
  key: String!
  "Optional tag value"
  value: String
}

"""
Input for creating or updating a secret.
Represents a credential, certificate, token, or key from an external data source.

"""

input SecretInput {
  "Unique identifier from the source system"
  originId: String!
  "Provider identifier within the source system"
  providerId: String!
  "Type of provider system (e.g., 'aws', 'azure', 'kubernetes')"
  providerType: String!
  "Display name of the secret"
  name: String!
  "Category of secret (Secret, Certificate, Token, Key)"
  type: String
  "Optional subtype for further classification"
  subType: String
  "Geographic or logical location of the secret"
  location: String
  "Human-readable description of the secret"
  description: String
  "Start date/time when the secret becomes valid"
  validityFrom: AWSDateTime
  "End date/time when the secret expires"
  validityTo: AWSDateTime
  "Associated username if applicable"
  username: String
  "Array of tags, annotations, and labels"
  tags: [TagEntryInput]
  "Last time the secret was retrieved from the source system"
  originLastRetrieved: AWSDateTime
  "Additional metadata as JSON"
  additionalData: AWSJSON
  "Last update timestamp from the source system"
  originUpdatedAt: AWSDateTime
  "Whether the secret value changes dynamically"
  permanence: SecretPermanence
  "Secret value (use with caution, consider security implications)"
  secretValue: String
  "Creation timestamp from the source system"
  originCreatedAt: AWSDateTime
}

"""
Filter criteria for querying secrets.
Supports complex boolean logic with AND, OR, and NOT operators.

"""

input SecretsFilterInput {
  "Filter by exact secret ID match"
  id: StringEqualsFilter
  "Filter by exact provider ID match"
  providerId: StringEqualsFilter
  "Filter by exact provider type match"
  providerType: StringEqualsFilter
  "Filter by origin update timestamp"
  originUpdatedAt: DateFilter
  "Filter by origin ID containing substring"
  originId: StringContainsFilter
  "Filter by exact risk ID match"
  riskId: StringEqualsFilter
  "Filter by name containing substring"
  name: StringContainsFilter
  "Filter by store name containing substring"
  storeName: StringContainsFilter
  "Filter by secret type"
  type: StringEqualsFilter
  "Filter by data source type"
  dataSourceType: DataSourceTypeFilter
  "Logical AND: all conditions must match"
  and: [SecretsFilterInput]
  "Logical OR: any condition must match"
  or: [SecretsFilterInput]
  "Logical NOT: negate the filter condition"
  not: SecretsFilterInput
}

"""Filter for exact string equality matching."""

input StringEqualsFilter {
  "Value to match exactly"
  eq: String
}

"""Filter for substring matching within strings."""

input StringContainsFilter {
  "Substring to search for"
  contains: String
}

"""Filter for date/time range comparisons."""

input DateFilter {
  "Less than: filter for dates before this value"
  lt: AWSDateTime
  "Greater than: filter for dates after this value"
  gt: AWSDateTime
}

"""Filter for data source type matching."""

input DataSourceTypeFilter {
  "Data source type to match"
  eq: DataSourceType
}

